# ── Kubernetes Manifests — Missing Services & Production Hardening ─────────────
#
# This file supplements the existing k8s/manifests.yml.
# The original manifests only deployed 3 of 11 services.
# Append this file's contents to manifests.yml, or apply separately:
#
#   kubectl apply -f k8s/manifests.yml -n compliance
#   kubectl apply -f k8s/manifests-additional.yml -n compliance

---
# ── Compliance Service ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-service
  namespace: compliance
  labels:
    app: compliance-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: compliance-service
  template:
    metadata:
      labels:
        app: compliance-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8083"
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: compliance-service
          image: compliance/compliance-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: compliance-config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SERVER_PORT
              value: "8083"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: compliance-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: compliance-secrets
                  key: JWT_SECRET
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 45
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: compliance-service-svc
  namespace: compliance
spec:
  selector:
    app: compliance-service
  ports:
    - port: 8083
      targetPort: 8083
---
