server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cloud:
    gateway:
      server:
        webflux:

          httpclient:
            protocol: HTTP11

          globalcors:
            corsConfigurations:
              '[/**]':
                allowedOriginPatterns:
                  - "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "*"
                exposedHeaders:
                  - "*"

          routes:

            # ================= AUTH =================
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**

            # ================= ENTITY =================
            - id: entity-service
              uri: lb://entity-service
              predicates:
                - Path=/api/v1/entities/**

            # ================= OTHER SERVICES =================
            - id: compliance-service
              uri: lb://compliance-service
              predicates:
                - Path=/compliance/**
              filters:
                - StripPrefix=1

            - id: initiator-service
              uri: lb://initiator-service
              predicates:
                - Path=/initiator/**
              filters:
                - StripPrefix=1

            - id: investor-service
              uri: lb://investor-service
              predicates:
                - Path=/investor/**
              filters:
                - StripPrefix=1

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/notification/**
              filters:
                - StripPrefix=1

            - id: report-service
              uri: lb://report-service
              predicates:
                - Path=/report/**
              filters:
                - StripPrefix=1

            - id: audit-service
              uri: lb://audit-service
              predicates:
                - Path=/audit/**
              filters:
                - StripPrefix=1

            - id: archive-service
              uri: lb://archive-service
              predicates:
                - Path=/archive/**
              filters:
                - StripPrefix=1

            # ================= SWAGGER UI =================
            - id: swagger-ui-html
              uri: lb://auth-service
              predicates:
                - Path=/swagger-ui.html

            - id: swagger-ui-assets
              uri: lb://auth-service
              predicates:
                - Path=/swagger-ui/**

            - id: swagger-webjars
              uri: lb://auth-service
              predicates:
                - Path=/webjars/**

            - id: swagger-config
              uri: lb://auth-service
              predicates:
                - Path=/v3/api-docs/swagger-config

            # ================= OPENAPI DOCS =================
            - id: auth-docs
              uri: lb://auth-service
              predicates:
                - Path=/v3/api-docs/auth,/v3/api-docs/auth/**
              filters:
                - RewritePath=/v3/api-docs/auth(?<segment>/?.*), /v3/api-docs${segment}

            - id: entity-docs
              uri: lb://entity-service
              predicates:
                - Path=/v3/api-docs/entity,/v3/api-docs/entity/**
              filters:
                - RewritePath=/v3/api-docs/entity(?<segment>/?.*), /v3/api-docs${segment}

            - id: compliance-docs
              uri: lb://compliance-service
              predicates:
                - Path=/v3/api-docs/compliance,/v3/api-docs/compliance/**
              filters:
                - RewritePath=/v3/api-docs/compliance(?<segment>/?.*), /v3/api-docs${segment}

            - id: initiator-docs
              uri: lb://initiator-service
              predicates:
                - Path=/v3/api-docs/initiator,/v3/api-docs/initiator/**
              filters:
                - RewritePath=/v3/api-docs/initiator(?<segment>/?.*), /v3/api-docs${segment}

            - id: investor-docs
              uri: lb://investor-service
              predicates:
                - Path=/v3/api-docs/investor,/v3/api-docs/investor/**
              filters:
                - RewritePath=/v3/api-docs/investor(?<segment>/?.*), /v3/api-docs${segment}

            - id: notification-docs
              uri: lb://notification-service
              predicates:
                - Path=/v3/api-docs/notification,/v3/api-docs/notification/**
              filters:
                - RewritePath=/v3/api-docs/notification(?<segment>/?.*), /v3/api-docs${segment}

            - id: report-docs
              uri: lb://report-service
              predicates:
                - Path=/v3/api-docs/report,/v3/api-docs/report/**
              filters:
                - RewritePath=/v3/api-docs/report(?<segment>/?.*), /v3/api-docs${segment}

            - id: audit-docs
              uri: lb://audit-service
              predicates:
                - Path=/v3/api-docs/audit,/v3/api-docs/audit/**
              filters:
                - RewritePath=/v3/api-docs/audit(?<segment>/?.*), /v3/api-docs${segment}

            - id: archive-docs
              uri: lb://archive-service
              predicates:
                - Path=/v3/api-docs/archive,/v3/api-docs/archive/**
              filters:
                - RewritePath=/v3/api-docs/archive(?<segment>/?.*), /v3/api-docs${segment}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true

    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true
    path: /swagger-ui.html

    urls:
      - name: AUTH SERVICE
        url: /v3/api-docs/auth

      - name: ENTITY SERVICE
        url: /v3/api-docs/entity

      - name: COMPLIANCE SERVICE
        url: /v3/api-docs/compliance

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG