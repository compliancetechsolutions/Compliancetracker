server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

app:
  kafka:
    topics:
      compliance-created: compliance-created
      notification-events: notification-events
      notification-dlt: notification-events.DLT

spring:

  application:
    name: notification-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/compliance}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:localpassword}
    hikari:
      pool-name: notification-pool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      auto-commit: false

  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification_schema
        jdbc:
          batch_size: 100

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration
    schemas:
      - notification_schema
    default-schema: notification_schema

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        # REQUIRED: with type headers disabled, JsonDeserializer needs a
        # default target type to deserialize into — otherwise it produces
        # LinkedHashMap and NotificationEventConsumer's typed parameter
        # binding fails at runtime.
        spring.json.value.default.type: com.compliance.common.kafka.event.NotificationEvent

    producer:
      retries: 5
      acks: all
      batch-size: 32768
      compression-type: snappy
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        linger.ms: 10
        max.in.flight.requests.per.connection: 5

    listener:
      concurrency: 10
      ack-mode: manual_immediate
      missing-topics-fatal: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: 587
    username: ${MAIL_USERNAME:test@gmail.com}
    password: ${MAIL_PASSWORD:test}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.compliance: INFO
    org.apache.kafka: WARN

notification:
  retry:
    enabled: true
    interval: 30000

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/compliance
  kafka:
    bootstrap-servers: kafka:9092