server:
  port: ${SERVER_PORT:8081}

  shutdown: graceful

  compression:
    enabled: true

    mime-types:
      - application/json

  http2:
    enabled: false

# =======================================================
# SPRING
# =======================================================

spring:

  application:
    name: auth-service

  lifecycle:

    timeout-per-shutdown-phase: 30s

# =======================================================
# DATASOURCE
# =======================================================

  datasource:

    url: ${DB_URL:jdbc:postgresql://localhost:5433/compliance}

    username: ${DB_USERNAME:postgres}

    password: ${DB_PASSWORD:Zaq@12wsx#}

    hikari:

      pool-name: auth-pool

      maximum-pool-size: 10

      minimum-idle: 2

      idle-timeout: 30000

      connection-timeout: 20000

      max-lifetime: 1800000

      leak-detection-threshold: 60000

      auto-commit: false

# =======================================================
# JPA
# =======================================================

  jpa:

    hibernate:

      ddl-auto: validate

    show-sql: false

    open-in-view: false

    properties:

      hibernate:

        format_sql: false

        default_schema: auth_schema

        default_batch_fetch_size: 100

        jdbc:

          batch_size: 20

        order_inserts: true

        order_updates: true

# =======================================================
# FLYWAY
# =======================================================

  flyway:

    enabled: true

    locations:
      classpath:db/migration

    schemas:
      - auth_schema
      - event_schema

    baseline-on-migrate: true

# =======================================================
# KAFKA
# =======================================================

  kafka:

    bootstrap-servers:
      ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ===================================================
# CONSUMER
# ===================================================

    consumer:

      group-id:
        auth-group

# ===================================================
# PRODUCER
# ===================================================

    producer:

      retries: 10

      acks: all

      batch-size: 32768

      buffer-memory: 67108864

      compression-type: snappy

      key-serializer:
        org.apache.kafka.common.serialization.StringSerializer

      value-serializer:
        org.springframework.kafka.support.serializer.JsonSerializer

      properties:

        "[linger.ms]": 15

        "[enable.idempotence]": true

        "[max.in.flight.requests.per.connection]": 5

        "[delivery.timeout.ms]": 120000

        "[request.timeout.ms]": 30000

        "[retry.backoff.ms]": 1000

        "[spring.json.add.type.headers]": false

# ===================================================
# LISTENER
# ===================================================

    listener:

      missing-topics-fatal: false

# =======================================================
# JACKSON
# =======================================================

  jackson:

    serialization:

      write-dates-as-timestamps: false

# =======================================================
# JWT
# =======================================================

jwt:

  secret:
    ${JWT_SECRET:change-me}

  access-token-expiry-ms:
    ${JWT_ACCESS_EXPIRY_MS:604800000}

  refresh-token-expiry-days:
    ${JWT_REFRESH_EXPIRY_DAYS:7}

# =======================================================
# EUREKA
# =======================================================

eureka:

  client:

    service-url:

      defaultZone:
        ${EUREKA_URL:http://localhost:8761/eureka}

    register-with-eureka: true

    fetch-registry: false

    registry-fetch-interval-seconds: 10

    initial-instance-info-replication-interval-seconds: 5

  instance:

    prefer-ip-address: true

# =======================================================
# SWAGGER
# =======================================================

springdoc:

  api-docs:

    enabled: true

  swagger-ui:

    enabled: true

swagger:

  gateway-url:
    ${GATEWAY_URL:http://localhost:8080}

# =======================================================
# ACTUATOR
# =======================================================

management:

  endpoints:

    web:

      exposure:

        include:
          - health
          - prometheus
          - startup

  endpoint:

    health:

      show-details: always

      probes:

        enabled: true

  health:

    kafka:

      enabled: true

  tracing:

    enabled: false

    sampling:

      probability: 0.0

  prometheus:

    metrics:

      export:

        enabled: true

# =======================================================
# LOGGING
# =======================================================

logging:

  level:

    com.compliance:
      ${LOG_LEVEL:INFO}

    org.springframework.security:
      WARN

    org.apache.kafka:
      WARN

  pattern:

    console:

      "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

# =======================================================
# DOCKER PROFILE
# =======================================================

---

spring:

  config:

    activate:

      on-profile:
        docker

  datasource:

    url:
      jdbc:postgresql://postgres:5432/compliance

    username:
      postgres

    password:
      ${DB_PASSWORD:Zaq@12wsx#}

  kafka:

    bootstrap-servers:
      kafka:9092

eureka:

  client:

    service-url:

      defaultZone:
        http://eureka:8761/eureka

    register-with-eureka: true

    fetch-registry: false
