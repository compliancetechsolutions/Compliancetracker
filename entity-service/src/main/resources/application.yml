server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json
  http2:
    enabled: true

spring:
  application:
    name: entity-service

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/Compliance}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:localpassword}
    hikari:
      pool-name: entity-pool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update   # 🔥 TEMP: create tables automatically
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: entity_schema
    default-schema: entity_schema
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka
    registry-fetch-interval-seconds: 10
    initial-instance-info-replication-interval-seconds: 5

  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:0.1}

  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.compliance: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://postgres:5432/Compliance

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka
    registry-fetch-interval-seconds: 10
    initial-instance-info-replication-interval-seconds: 5