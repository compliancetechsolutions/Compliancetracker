server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  compression:
    enabled: true
    mime-types:
      - application/json
  http2:
    enabled: true

# =======================================================
# APP
# =======================================================

app:
  kafka:
    topics:
      user-events: user-events
      investor-entity-events: investor-entity-event
      representative-entity-events: representative-entity-event
      compliance-created: compliance-created
      notification-events: notification-events
      entity-events: entity-events


# =======================================================
# SPRING
# =======================================================

spring:
  application:
    name: entity-service

  web:
    resources:
      add-mappings: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

# =======================================================
# DATASOURCE
# =======================================================

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/compliance}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:localpassword}
    hikari:
      pool-name: entity-pool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      auto-commit: false

# =======================================================
# JPA
# =======================================================

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_schema: entity_schema
        default_batch_fetch_size: 100
        order_inserts: true
        order_updates: true
        jdbc:
          batch_size: 20
          time_zone: UTC

# =======================================================
# FLYWAY
# =======================================================

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    schemas:
      - entity_schema
    default-schema: entity_schema
    baseline-on-migrate: true

# =======================================================
# KAFKA
# =======================================================

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: false
    consumer:
      group-id: entity-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.compliance.common.kafka.event.UserEvent
        spring.json.use.type.headers: false
    producer:
      retries: 5
      acks: all
      batch-size: 32768
      compression-type: snappy
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        linger.ms: 10
        max.in.flight.requests.per.connection: 5
    listener:
      concurrency: 3
      ack-mode: manual_immediate
      missing-topics-fatal: false

# =======================================================
# JACKSON
# =======================================================

  jackson:
    serialization:
      write-dates-as-timestamps: false

# =======================================================
# JWT
# =======================================================

jwt:
  secret: ${JWT_SECRET:change-me}

# =======================================================
# EUREKA
# =======================================================



# =======================================================
# ACTUATOR
# =======================================================

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
          - startup
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    env:
      show-values: never
  health:
    kafka:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:0.1}
  prometheus:
    metrics:
      export:
        enabled: true

# =======================================================
# LOGGING
# =======================================================

logging:
  level:
    com.compliance: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.apache.kafka: WARN
    org.springframework.kafka.listener: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

# =======================================================
# DOCKER PROFILE
# =======================================================

# =======================================================
# DOCKER PROFILE
# =======================================================

---

spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://postgres:5432/compliance

  kafka:
    bootstrap-servers: kafka:9092


eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka
  