services:

  postgres:
    image: postgres:17-alpine
    container_name: postgres

    environment:
      POSTGRES_DB: compliance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Zaq@12wsx#

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: always

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 5s
      retries: 10



  redis:
    image: redis:7-alpine
    container_name: redis

    command: redis-server --requirepass devpassword

    ports:
      - "6379:6379"

    restart: always

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "devpassword", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10



  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    volumes:
      - kafka_data:/var/lib/kafka/data

    restart: always

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 10



  eureka:
    build:
      context: ..
      dockerfile: discovery-server/Dockerfile

    container_name: eureka

    ports:
      - "8761:8761"

    volumes:
      - ~/.m2:/root/.m2

    depends_on:
      postgres:
        condition: service_healthy

    restart: always

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8761/actuator/health || exit 1"
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s



  auth-service:
    build:
      context: ..
      dockerfile: auth-service/Dockerfile

    container_name: auth-service

    ports:
      - "8081:8081"

    environment:
      EUREKA_URL: http://eureka:8761/eureka

      DB_URL: jdbc:postgresql://postgres:5432/compliance
      DB_USERNAME: postgres
      DB_PASSWORD: Zaq@12wsx#

      JWT_SECRET: my-super-secret-key-12345678901234567890

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    volumes:
      - ~/.m2:/root/.m2

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka:
        condition: service_healthy

    restart: always

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8081/actuator/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s



  entity-service:
    build:
      context: ..
      dockerfile: entity-service/Dockerfile

    container_name: entity-service

    ports:
      - "8082:8082"

    environment:
      EUREKA_URL: http://eureka:8761/eureka

      DB_URL: jdbc:postgresql://postgres:5432/compliance
      DB_USERNAME: postgres
      DB_PASSWORD: Zaq@12wsx#

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    volumes:
      - ~/.m2:/root/.m2

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka:
        condition: service_healthy

    restart: always

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8082/actuator/health || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s



  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile

    container_name: api-gateway

    ports:
      - "8080:8080"

    environment:
      EUREKA_URL: http://eureka:8761/eureka

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: devpassword

      JWT_SECRET: my-super-secret-key-12345678901234567890

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      SPRING_DATA_REDIS_HOST: redis          # <-- added
      SPRING_DATA_REDIS_PORT: 6379           # <-- added
      SPRING_DATA_REDIS_PASSWORD: devpassword  # <-- added

    volumes:
      - ~/.m2:/root/.m2

    depends_on:
      auth-service:
        condition: service_healthy
      entity-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka:
        condition: service_healthy

    command:
      [
        "sh",
        "-c",
        "sleep 25 && java -jar /app/app.jar"
      ]

    restart: always

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health || exit 1"
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s



volumes:
  postgres_data:
  kafka_data: